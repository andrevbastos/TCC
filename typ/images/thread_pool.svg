<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <!-- Arrowhead marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4B5563" />
    </marker>
    <!-- Drop shadow filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.1" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: bold; }
    .subtitle { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #4B5563; }
    .label { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #1F2937; text-anchor: middle; }
    .task-text { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill: #1F2937; text-anchor: middle; }
    .arrow-text { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #4B5563; font-weight: bold; text-anchor: middle; }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#FFFFFF" rx="8" />

  <!-- Main Thread Group -->
  <g transform="translate(40, 140)" filter="url(#shadow)">
    <rect width="160" height="90" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2" />
    <text x="80" y="32" class="label">Thread Principal</text>
    <text x="80" y="50" class="subtitle" text-anchor="middle">(Interface / OpenGL)</text>
    <text x="80" y="68" class="subtitle" text-anchor="middle" font-size="10px" fill="#2563EB">Envia tarefas p/ filas</text>
  </g>

  <!-- Connection: Main Thread to Queue Splitter -->
  <path d="M 200 185 L 230 185" fill="none" stroke="#9CA3AF" stroke-width="2" />
  <!-- Splitter Line -->
  <path d="M 230 85 L 230 295" fill="none" stroke="#9CA3AF" stroke-width="2" />
  <!-- Arrows to Queues -->
  <path d="M 230 85 L 260 85" fill="none" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 230 185 L 260 185" fill="none" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 230 295 L 260 295" fill="none" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)" />
  
  <text x="220" y="185" class="arrow-text" transform="rotate(-90 220 185)">Enfileirar (Push)</text>

  <!-- Filas Multinível Group -->
  <!-- Fila 1: Alta Prioridade -->
  <g transform="translate(270, 45)" filter="url(#shadow)">
    <rect width="250" height="80" rx="6" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5" />
    <text x="12" y="22" class="title" fill="#991B1B">Fila 1: Alta Prioridade</text>
    <text x="12" y="37" class="subtitle" fill="#991B1B" font-size="10px">Geração de Ruído / Parâmetros</text>
    <!-- Task A -->
    <g transform="translate(15, 45)">
      <rect width="90" height="26" rx="4" fill="#FCA5A5" stroke="#EF4444" stroke-width="1" />
      <text x="45" y="17" class="task-text" font-weight="bold" fill="#7F1D1D">Gerar Ruído</text>
    </g>
    <!-- Task B -->
    <g transform="translate(115, 45)">
      <rect width="110" height="26" rx="4" fill="#FCA5A5" stroke="#EF4444" stroke-width="1" />
      <text x="55" y="17" class="task-text" font-weight="bold" fill="#7F1D1D">Parâmetros Criação</text>
    </g>
  </g>

  <!-- Fila 2: Média Prioridade -->
  <g transform="translate(270, 145)" filter="url(#shadow)">
    <rect width="250" height="80" rx="6" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5" />
    <text x="12" y="22" class="title" fill="#92400E">Fila 2: Média Prioridade</text>
    <text x="12" y="37" class="subtitle" fill="#92400E" font-size="10px">Triangulação &amp; Extração do Grafo</text>
    <!-- Task C -->
    <g transform="translate(15, 45)">
      <rect width="100" height="26" rx="4" fill="#FDE047" stroke="#D97706" stroke-width="1" />
      <text x="50" y="17" class="task-text" font-weight="bold" fill="#78350F">Triangulação 3D</text>
    </g>
    <!-- Task D -->
    <g transform="translate(125, 45)">
      <rect width="100" height="26" rx="4" fill="#FDE047" stroke="#D97706" stroke-width="1" />
      <text x="50" y="17" class="task-text" font-weight="bold" fill="#78350F">Extração Grafo</text>
    </g>
  </g>

  <!-- Fila 3: Baixa Prioridade -->
  <g transform="translate(270, 255)" filter="url(#shadow)">
    <rect width="250" height="80" rx="6" fill="#F0FDF4" stroke="#10B981" stroke-width="1.5" />
    <text x="12" y="22" class="title" fill="#065F46">Fila 3: Baixa Prioridade</text>
    <text x="12" y="37" class="subtitle" fill="#065F46" font-size="10px">Escrita em Disco / I/O</text>
    <!-- Task E -->
    <g transform="translate(15, 45)">
      <rect width="95" height="26" rx="4" fill="#A7F3D0" stroke="#059669" stroke-width="1" />
      <text x="47.5" y="17" class="task-text" font-weight="bold" fill="#064E3B">Escrita Disco</text>
    </g>
    <!-- Task F -->
    <g transform="translate(120, 45)">
      <rect width="110" height="26" rx="4" fill="#A7F3D0" stroke="#059669" stroke-width="1" />
      <text x="55" y="17" class="task-text" font-weight="bold" fill="#064E3B">Salvar Imagem PNG</text>
    </g>
  </g>

  <!-- Connection: Queues to Thread Pool Merger -->
  <path d="M 520 85 L 550 85" fill="none" stroke="#9CA3AF" stroke-width="2" />
  <path d="M 520 185 L 550 185" fill="none" stroke="#9CA3AF" stroke-width="2" />
  <path d="M 520 295 L 550 295" fill="none" stroke="#9CA3AF" stroke-width="2" />
  <!-- Merger Line -->
  <path d="M 550 85 L 550 295" fill="none" stroke="#9CA3AF" stroke-width="2" />
  <!-- Arrow to Thread Pool -->
  <path d="M 550 185 L 580 185" fill="none" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)" />
  
  <text x="562" y="185" class="arrow-text" transform="rotate(-90 562 185)">Consome (Pop)</text>

  <!-- Thread Pool Group -->
  <g transform="translate(590, 45)" filter="url(#shadow)">
    <!-- Container -->
    <rect width="170" height="290" rx="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="4 4" />
    <text x="85" y="25" class="label">Pool de Threads</text>
    <text x="85" y="40" class="subtitle" text-anchor="middle">(Threads Trabalhadoras)</text>

    <!-- Thread 1 -->
    <g transform="translate(15, 55)">
      <rect width="140" height="60" rx="6" fill="#FFFFFF" stroke="#4B5563" stroke-width="1" />
      <circle cx="20" cy="30" r="6" fill="#EF4444" /> <!-- Red status = Working on High Priority -->
      <text x="35" y="24" class="label" text-anchor="start" font-size="11px">Thread 1 (Ativa)</text>
      <text x="35" y="41" class="subtitle" text-anchor="start" font-size="10px" fill="#B91C1C">Gerando Ruído...</text>
    </g>

    <!-- Thread 2 -->
    <g transform="translate(15, 130)">
      <rect width="140" height="60" rx="6" fill="#FFFFFF" stroke="#4B5563" stroke-width="1" />
      <circle cx="20" cy="30" r="6" fill="#F59E0B" /> <!-- Yellow status = Working on Medium Priority -->
      <text x="35" y="24" class="label" text-anchor="start" font-size="11px">Thread 2 (Ativa)</text>
      <text x="35" y="41" class="subtitle" text-anchor="start" font-size="10px" fill="#B45309">Triangulando 3D...</text>
    </g>

    <!-- Thread 3 -->
    <g transform="translate(15, 205)">
      <rect width="140" height="60" rx="6" fill="#FFFFFF" stroke="#4B5563" stroke-width="1" />
      <circle cx="20" cy="30" r="6" fill="#10B981" /> <!-- Green status = Idle / Waiting -->
      <text x="35" y="24" class="label" text-anchor="start" font-size="11px">Thread 3 (Ociosa)</text>
      <text x="35" y="41" class="subtitle" text-anchor="start" font-size="10px" fill="#047857">Aguardando tarefas</text>
    </g>
  </g>
</svg>
