<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <!-- Arrowhead marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94A3B8" />
    </marker>
  </defs>

  <style>
    .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #1E293B; }
    .subtitle { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #64748B; }
    .label { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #1E293B; }
    .label-center { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #1E293B; text-anchor: middle; }
    .task-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; fill: #334155; text-anchor: middle; }
    .arrow-text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #64748B; font-weight: 600; text-anchor: middle; }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#FFFFFF" rx="6" />

  <!-- Main Thread Group -->
  <g transform="translate(40, 140)">
    <rect width="160" height="90" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="80" y="32" class="label-center">Thread Principal</text>
    <text x="80" y="50" class="subtitle" text-anchor="middle">(Interface / OpenGL)</text>
    <text x="80" y="68" class="subtitle" text-anchor="middle" font-size="10px" fill="#475569" font-weight="500">Envia tarefas p/ filas</text>
  </g>

  <!-- Connection: Main Thread to Queue Splitter -->
  <path d="M 200 185 L 230 185" fill="none" stroke="#94A3B8" stroke-width="1.5" />
  <!-- Splitter Line -->
  <path d="M 230 85 L 230 295" fill="none" stroke="#94A3B8" stroke-width="1.5" />
  <!-- Arrows to Queues -->
  <path d="M 230 85 L 260 85" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 230 185 L 260 185" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 230 295 L 260 295" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)" />
  
  <text x="220" y="185" class="arrow-text" transform="rotate(-90 220 185)">Enfileirar (Push)</text>

  <!-- Filas Multinível Group -->
  <!-- Fila 1: Alta Prioridade -->
  <g transform="translate(270, 45)">
    <rect width="250" height="80" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="12" y="22" class="title">Fila 1: Alta Prioridade</text>
    <text x="12" y="37" class="subtitle" font-size="10px">Geração de Ruído / Parâmetros</text>
    <!-- Task A -->
    <g transform="translate(15, 45)">
      <rect width="90" height="26" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <text x="45" y="17" class="task-text" font-weight="600">Gerar Ruído</text>
    </g>
    <!-- Task B -->
    <g transform="translate(115, 45)">
      <rect width="110" height="26" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <text x="55" y="17" class="task-text" font-weight="600">Parâmetros Criação</text>
    </g>
  </g>

  <!-- Fila 2: Média Prioridade -->
  <g transform="translate(270, 145)">
    <rect width="250" height="80" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="12" y="22" class="title">Fila 2: Média Prioridade</text>
    <text x="12" y="37" class="subtitle">Triangulação &amp; Extração do Grafo</text>
    <!-- Task C -->
    <g transform="translate(15, 45)">
      <rect width="100" height="26" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <text x="50" y="17" class="task-text" font-weight="600">Triangulação 3D</text>
    </g>
    <!-- Task D -->
    <g transform="translate(125, 45)">
      <rect width="100" height="26" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <text x="50" y="17" class="task-text" font-weight="600">Extração Grafo</text>
    </g>
  </g>

  <!-- Fila 3: Baixa Prioridade -->
  <g transform="translate(270, 255)">
    <rect width="250" height="80" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="12" y="22" class="title">Fila 3: Baixa Prioridade</text>
    <text x="12" y="37" class="subtitle">Escrita em Disco / I/O</text>
    <!-- Task E -->
    <g transform="translate(15, 45)">
      <rect width="95" height="26" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <text x="47.5" y="17" class="task-text" font-weight="600">Escrita Disco</text>
    </g>
    <!-- Task F -->
    <g transform="translate(120, 45)">
      <rect width="110" height="26" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <text x="55" y="17" class="task-text" font-weight="600">Salvar Imagem PNG</text>
    </g>
  </g>

  <!-- Connection: Queues to Thread Pool Merger -->
  <path d="M 520 85 L 550 85" fill="none" stroke="#94A3B8" stroke-width="1.5" />
  <path d="M 520 185 L 550 185" fill="none" stroke="#94A3B8" stroke-width="1.5" />
  <path d="M 520 295 L 550 295" fill="none" stroke="#94A3B8" stroke-width="1.5" />
  <!-- Merger Line -->
  <path d="M 550 85 L 550 295" fill="none" stroke="#94A3B8" stroke-width="1.5" />
  <!-- Arrow to Thread Pool -->
  <path d="M 550 185 L 580 185" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)" />
  
  <text x="562" y="185" class="arrow-text" transform="rotate(-90 562 185)">Consome (Pop)</text>

  <!-- Thread Pool Group -->
  <g transform="translate(590, 45)">
    <!-- Container -->
    <rect width="170" height="290" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4" />
    <text x="85" y="25" class="label-center">Pool de Threads</text>
    <text x="85" y="40" class="subtitle" text-anchor="middle">(Threads Trabalhadoras)</text>

    <!-- Thread 1 -->
    <g transform="translate(15, 55)">
      <rect width="140" height="60" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
      <circle cx="20" cy="30" r="5" fill="#475569" />
      <text x="35" y="24" class="label" text-anchor="start" font-size="11px">Thread 1 (Ativa)</text>
      <text x="35" y="41" class="subtitle" text-anchor="start" font-size="10px" fill="#475569" font-weight="500">Gerando Ruído...</text>
    </g>

    <!-- Thread 2 -->
    <g transform="translate(15, 130)">
      <rect width="140" height="60" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
      <circle cx="20" cy="30" r="5" fill="#475569" />
      <text x="35" y="24" class="label" text-anchor="start" font-size="11px">Thread 2 (Ativa)</text>
      <text x="35" y="41" class="subtitle" text-anchor="start" font-size="10px" fill="#475569" font-weight="500">Triangulando 3D...</text>
    </g>

    <!-- Thread 3 -->
    <g transform="translate(15, 205)">
      <rect width="140" height="60" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
      <circle cx="20" cy="30" r="5" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" />
      <text x="35" y="24" class="label" text-anchor="start" font-size="11px" fill="#64748B">Thread 3 (Ociosa)</text>
      <text x="35" y="41" class="subtitle" text-anchor="start" font-size="10px" fill="#94A3B8">Aguardando tarefas</text>
    </g>
  </g>
</svg>
